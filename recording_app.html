<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word list recorder</title>
<style>
  :root { --fg:#1d232b; --muted:#5f6b7a; --bg:#f6f7f9; --card:#fff; --accent:#2457c5; --rec:#c62828; --ok:#2e7d32; --warn:#b26a00; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--fg); background:var(--bg); }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  .card { background:var(--card); border-radius:14px; padding:24px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size:1.4rem; margin:0 0 12px; }
  p { line-height:1.5; }
  label { display:block; font-weight:600; margin:16px 0 6px; }
  input[type=text] { width:100%; font-size:1.05rem; padding:10px 12px; border:1px solid #c9cfd8; border-radius:8px; }
  .consent { display:flex; gap:10px; align-items:flex-start; font-weight:400; background:#f1f4fa; padding:12px; border-radius:8px; }
  .consent input { margin-top:4px; transform:scale(1.2); }
  button { font:inherit; font-size:1rem; padding:12px 18px; border-radius:10px; border:1px solid #c9cfd8; background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:16px; }
  .progress { color:var(--muted); text-align:center; font-size:.95rem; }
  .instr { font-size:.95rem; background:#f1f4fa; padding:10px 12px; border-radius:8px; margin:12px 0; }
  ol.words { list-style:none; padding:0; margin:16px 0 8px; display:grid; grid-template-columns:repeat(auto-fill, minmax(100px, 1fr)); gap:6px 10px; counter-reset:w; }
  ol.words li { counter-increment:w; font-size:clamp(1rem, 4.2vw, 1.25rem); font-weight:700; letter-spacing:.02em; padding:6px 4px; border-bottom:1px solid #eceff3; }
  ol.words li::before { content:counter(w); font-size:.7rem; font-weight:400; color:var(--muted); margin-right:6px; vertical-align:middle; }
  .meter { height:10px; background:#e3e7ee; border-radius:5px; overflow:hidden; margin:18px 0 4px; }
  .meter div { height:100%; width:0; background:var(--ok); transition: width .05s linear; }
  #recBtn { width:100px; height:100px; border-radius:50%; font-weight:700; font-size:1.1rem; background:var(--rec); border-color:var(--rec); color:#fff; }
  #recBtn.recording { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 12px rgba(198,40,40,.18); } }
  .status { text-align:center; min-height:1.5em; margin-top:10px; color:var(--muted); }
  .status.warn { color:var(--warn); font-weight:600; }
  .status.err { color:var(--rec); font-weight:600; }
  ul.files { list-style:none; padding:0; margin:16px 0; font-size:.92rem; }
  ul.files li { display:flex; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px solid #eceff3; }
  .ok { color:var(--ok); } .bad { color:var(--rec); } .pending { color:var(--muted); }
  .hint { font-size:.85rem; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<main>

  <!-- Start screen -->
  <section id="sStart" class="card">
    <h1 id="title">Word list recording</h1>
    <p id="intro"></p>
    <label for="pid" id="idLabel">Student ID</label>
    <input id="pid" type="text" autocomplete="off" placeholder="e.g. 2301234 or J.Smith">
    <label class="consent"><input id="consent" type="checkbox"> <span id="consentText"></span></label>
    <div class="row"><button id="startBtn" class="primary" disabled>Start</button></div>
    <div id="startStatus" class="status"></div>
  </section>

  <!-- Recording screen -->
  <section id="sRec" class="card" hidden>
    <div class="progress" id="progress"></div>
    <div class="instr" id="instr"></div>
    <ol class="words" id="wordList"></ol>
    <div class="meter"><div id="meterBar"></div></div>
    <div class="row"><button id="recBtn">Record</button></div>
    <div class="status" id="recStatus"></div>
    <div class="row">
      <button id="prevBtn">&larr; Back</button>
      <button id="playBtn" disabled>&#9654; Play</button>
      <button id="nextBtn" class="primary" disabled>Next &rarr;</button>
    </div>
    <p class="hint">Desktop: press the space bar to start/stop recording.</p>
  </section>

  <!-- Finish screen -->
  <section id="sDone" class="card" hidden>
    <h1>All done – thank you!</h1>
    <p id="doneMsg"></p>
    <ul class="files" id="fileList"></ul>
    <div class="row">
      <button id="retryBtn" class="primary" hidden>Retry failed uploads</button>
      <button id="zipBtn">Download all (zip)</button>
      <a id="reqLink" hidden target="_blank" rel="noopener"><button class="primary">Open upload folder</button></a>
    </div>
  </section>

</main>
<script>
/* ================== CONFIGURATION – edit this part ================== */
const CONFIG = {
  title: "Word list recording",
  intro: "Thank you for helping out with this activity! You'll see a list of words. Read the whole list aloud from start to finish, then do it again: three readings in total, each recorded separately. You can play back and re-record each reading. Please use a quiet room.",
  idLabel: "Name or student ID",
  consentText: "I agree to my recordings being stored and used for teaching purposes in this module.",

  // Shown above the word list on each reading ({n} and {total} can be used for the reading number).
  readingInstructions: "Press Record, read the words in order (left to right, row by row) at a natural pace with a short pause between words, then press Stop. Please don't say anything else, and don't read the numbers.",

  // Power Automate "When an HTTP request is received" URL. Leave "" to skip automatic upload.
  uploadUrl: "",

  // Optional OneDrive "Request files" link – shown as a backup way to hand in the zip.
  requestFilesUrl: "",

  repetitions: 3,          // number of separate readings of the whole list
  maxSeconds: 180,         // auto-stop safety limit per reading

  // Word lists. Choose one with ?list=name in the page URL; the first list is the default.
  lists: {
    wells: ["KIT", "DRESS", "TRAP", "LOT", "STRUT", "FOOT", "BATH", "CLOTH", "NURSE", "FLEECE", "FACE", "PALM", "THOUGHT", "GOAT", "GOOSE", "PRICE", "CHOICE", "MOUTH", "NEAR", "SQUARE", "START", "NORTH", "FORCE", "CURE", "HAPPY", "LETTER", "COMMA"]
  }
};
/* ==================================================================== */

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const listName = (params.get("list") && CONFIG.lists[params.get("list")]) ? params.get("list") : Object.keys(CONFIG.lists)[0];
const WORDS = CONFIG.lists[listName];

const REPS = CONFIG.repetitions;
const state = { pid: "", idx: 0, takes: new Array(REPS).fill(null), uploaded: {}, consentTime: null };
let ctx, stream, node, chunks = [], recording = false, peak = 0, recPeak = 0, autoStop = null, trackSettings = {};

/* ---------- Start screen ---------- */
$("title").textContent = CONFIG.title;
document.title = CONFIG.title;
$("intro").textContent = CONFIG.intro;
$("idLabel").textContent = CONFIG.idLabel;
$("consentText").textContent = CONFIG.consentText;

const cleanId = s => s.trim().replace(/[^A-Za-z0-9_-]/g, "");
function checkStart() { $("startBtn").disabled = !(cleanId($("pid").value) && $("consent").checked); }
$("pid").addEventListener("input", checkStart);
$("consent").addEventListener("change", checkStart);

$("startBtn").addEventListener("click", async () => {
  state.pid = cleanId($("pid").value);
  state.consentTime = new Date().toISOString();
  try {
    await initAudio();
  } catch (e) {
    $("startStatus").className = "status err";
    $("startStatus").textContent = micErrorMessage(e);
    return;
  }
  $("sStart").hidden = true;
  $("sRec").hidden = false;
  showWord();
});

function micErrorMessage(e) {
  if (!window.isSecureContext || !navigator.mediaDevices)
    return "This page isn't being served securely, so the browser blocks the microphone. Open it from its https:// address (e.g. GitHub Pages), not as a downloaded file or inside another app.";
  if (window.self !== window.top)
    return "This page is running inside another page or app preview, which blocks the microphone. Open it directly in Chrome, Edge, Firefox or Safari.";
  switch (e.name) {
    case "NotAllowedError":
    case "SecurityError":
      return "Microphone permission was refused. Click the lock/settings icon next to the address bar, allow the microphone, and reload. On Windows, also check Settings → Privacy & security → Microphone and make sure your browser is allowed.";
    case "NotFoundError":
      return "No microphone was found. Plug in or enable a microphone and reload.";
    case "NotReadableError":
      return "The microphone is in use by another app (e.g. Teams or Zoom) or blocked by the system. Close other apps using it and reload.";
    case "OverconstrainedError":
      return "Your microphone doesn't support the requested settings. Please tell your tutor (" + e.name + ").";
    default:
      return "Couldn't access the microphone (" + e.name + ": " + e.message + "). Please reload and try again.";
  }
}

/* ---------- Audio capture (raw PCM, no browser processing) ---------- */
async function initAudio() {
  stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: false }
  });
  trackSettings = stream.getAudioTracks()[0].getSettings ? stream.getAudioTracks()[0].getSettings() : {};
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  const source = ctx.createMediaStreamSource(stream);
  const onData = buf => {
    let p = 0;
    for (let i = 0; i < buf.length; i++) { const a = Math.abs(buf[i]); if (a > p) p = a; }
    peak = Math.max(peak * 0.9, p);
    if (recording) { chunks.push(buf); if (p > recPeak) recPeak = p; }
  };
  if (ctx.audioWorklet && window.AudioWorkletNode) {
    const code = "class R extends AudioWorkletProcessor{process(i){const c=i[0]&&i[0][0];if(c)this.port.postMessage(c.slice(0));return true;}}registerProcessor('rec',R);";
    const url = URL.createObjectURL(new Blob([code], { type: "application/javascript" }));
    await ctx.audioWorklet.addModule(url);
    node = new AudioWorkletNode(ctx, "rec");
    node.port.onmessage = e => onData(e.data);
  } else {
    node = ctx.createScriptProcessor(4096, 1, 1);
    node.onaudioprocess = e => onData(new Float32Array(e.inputBuffer.getChannelData(0)));
  }
  source.connect(node);
  const mute = ctx.createGain(); mute.gain.value = 0;   // keeps the graph running without echoing the mic
  node.connect(mute); mute.connect(ctx.destination);
  requestAnimationFrame(drawMeter);
}

function drawMeter() {
  $("meterBar").style.width = Math.min(100, Math.sqrt(peak) * 100) + "%";
  $("meterBar").style.background = peak > 0.98 ? "var(--rec)" : "var(--ok)";
  peak *= 0.92;
  requestAnimationFrame(drawMeter);
}

function encodeWav(parts, sr) {
  const n = parts.reduce((a, c) => a + c.length, 0);
  const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVE");
  str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, "data"); v.setUint32(40, n * 2, true);
  let o = 44;
  for (const c of parts) for (let i = 0; i < c.length; i++) {
    const s = Math.max(-1, Math.min(1, c[i]));
    v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true); o += 2;
  }
  return new Blob([buf], { type: "audio/wav" });
}

/* ---------- Recording screen ---------- */
const fileName = i => `${listName}_${state.pid}_rep${i + 1}.wav`;
for (const w of WORDS) { const li = document.createElement("li"); li.textContent = w; $("wordList").appendChild(li); }

function showWord() {
  const i = state.idx;
  $("progress").textContent = `Reading ${i + 1} of ${REPS}`;
  $("instr").textContent = CONFIG.readingInstructions.replace("{n}", i + 1).replace("{total}", REPS);
  $("prevBtn").disabled = i === 0;
  $("playBtn").disabled = !state.takes[i];
  $("nextBtn").disabled = !state.takes[i];
  $("nextBtn").innerHTML = i === REPS - 1 ? "Finish" : "Next reading &rarr;";
  setStatus(state.takes[i] ? "Recorded ✓ – play it back, re-record, or move on." : "");
}
function setStatus(msg, cls = "") { $("recStatus").className = "status " + cls; $("recStatus").textContent = msg; }

function startRec() {
  if (ctx.state !== "running") ctx.resume();
  chunks = []; recPeak = 0; recording = true;
  $("recBtn").textContent = "Stop"; $("recBtn").classList.add("recording");
  ["prevBtn", "playBtn", "nextBtn"].forEach(b => $(b).disabled = true);
  setStatus("Recording… read the whole list, then press Stop.");
  autoStop = setTimeout(stopRec, CONFIG.maxSeconds * 1000);
}
function stopRec() {
  if (!recording) return;
  clearTimeout(autoStop);
  setTimeout(() => {               // short tail so the last word isn't clipped
    recording = false;
    $("recBtn").textContent = "Record"; $("recBtn").classList.remove("recording");
    const blob = encodeWav(chunks, ctx.sampleRate);
    state.takes[state.idx] = blob;
    delete state.uploaded[fileName(state.idx)];
    showWord();
    if (recPeak > 0.98) setStatus("That was too loud (clipped). Move back a little and re-record.", "warn");
    else if (recPeak < 0.03) setStatus("That was very quiet. Check your microphone and re-record.", "warn");
  }, 250);
}
$("recBtn").addEventListener("click", () => recording ? stopRec() : startRec());
$("playBtn").addEventListener("click", () => {
  const b = state.takes[state.idx];
  if (b) new Audio(URL.createObjectURL(b)).play();
});
$("prevBtn").addEventListener("click", () => { state.idx--; showWord(); });
$("nextBtn").addEventListener("click", () => {
  if (state.idx < REPS - 1) { state.idx++; showWord(); window.scrollTo(0, 0); }
  else finish();
});
document.addEventListener("keydown", e => {
  if (e.code === "Space" && !$("sRec").hidden) { e.preventDefault(); $("recBtn").click(); }
});

/* ---------- Finish: upload + zip ---------- */
function infoFile() {
  const info = {
    id: state.pid, list: listName, words: WORDS, repetitions: REPS, consent: CONFIG.consentText, consentTime: state.consentTime,
    finished: new Date().toISOString(), sampleRate: ctx.sampleRate, bitDepth: 16, channels: 1,
    micSettings: trackSettings, userAgent: navigator.userAgent
  };
  return { name: `${listName}_${state.pid}_info.json`, blob: new Blob([JSON.stringify(info, null, 2)], { type: "application/json" }) };
}
function allFiles() {
  return [...state.takes.map((b, i) => ({ name: fileName(i), blob: b })), infoFile()];
}

function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}
async function uploadOne(f) {
  const sep = CONFIG.uploadUrl.includes("?") ? "&" : "?";
  const r = await fetch(CONFIG.uploadUrl + sep + "filename=" + encodeURIComponent(f.name), {
    method: "POST", headers: { "Content-Type": "text/plain" }, body: await blobToBase64(f.blob)
  });
  if (!r.ok) throw new Error("HTTP " + r.status);
}

function renderList(files) {
  $("fileList").innerHTML = "";
  for (const f of files) {
    const li = document.createElement("li");
    const st = state.uploaded[f.name];
    const label = !CONFIG.uploadUrl ? "" : st === true ? "✓ uploaded" : st === false ? "✗ failed" : st === "busy" ? "uploading…" : "waiting";
    const cls = st === true ? "ok" : st === false ? "bad" : "pending";
    li.innerHTML = `<span></span><span class="${cls}">${label}</span>`;
    li.firstChild.textContent = f.name;
    $("fileList").appendChild(li);
  }
}

async function uploadAll() {
  const files = allFiles();
  $("retryBtn").hidden = true;
  for (const f of files) {
    if (state.uploaded[f.name] === true) continue;
    state.uploaded[f.name] = "busy"; renderList(files);
    try { await uploadOne(f); state.uploaded[f.name] = true; }
    catch (e) { state.uploaded[f.name] = false; }
    renderList(files);
  }
  const failed = files.filter(f => state.uploaded[f.name] !== true).length;
  if (failed) {
    $("retryBtn").hidden = false;
    $("doneMsg").textContent = `${failed} file(s) didn't upload. Try again, or download the zip` + (CONFIG.requestFilesUrl ? " and add it to the upload folder." : " and send it to your tutor.");
  } else {
    $("doneMsg").textContent = "All your recordings have been uploaded. You can close this page.";
  }
}

function finish() {
  $("sRec").hidden = true; $("sDone").hidden = false;
  if (CONFIG.requestFilesUrl) { $("reqLink").href = CONFIG.requestFilesUrl; $("reqLink").hidden = false; }
  renderList(allFiles());
  if (CONFIG.uploadUrl) {
    $("doneMsg").textContent = "Uploading your recordings…";
    uploadAll();
  } else {
    $("doneMsg").textContent = "Please download the zip file" + (CONFIG.requestFilesUrl ? ", then press 'Open upload folder' and add it there." : " and send it to your tutor.");
  }
}
$("retryBtn").addEventListener("click", uploadAll);
$("zipBtn").addEventListener("click", async () => {
  const blob = await makeZip(allFiles());
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${listName}_${state.pid}.zip`;
  document.body.appendChild(a); a.click(); a.remove();
});

window.addEventListener("beforeunload", e => {
  const started = state.takes.some(Boolean);
  const done = CONFIG.uploadUrl && allFilesUploaded();
  if (started && !done) { e.preventDefault(); e.returnValue = ""; }
});
function allFilesUploaded() { return ctx && allFiles().every(f => state.uploaded[f.name] === true); }

/* ---------- Minimal zip writer (stored, no compression) ---------- */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
async function makeZip(files) {
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  const d = new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const f of files) {
    const name = enc.encode(f.name), data = new Uint8Array(await f.blob.arrayBuffer()), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(lh.buffer, name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
    ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(ch.buffer, name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((a, p) => a + p.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end.buffer], { type: "application/zip" });
}
</script>
</body>
</html>
