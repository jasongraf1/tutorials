<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word list recorder</title>
<style>
  :root { --fg:#1d232b; --muted:#5f6b7a; --bg:#f6f7f9; --card:#fff; --accent:#2457c5; --rec:#c62828; --ok:#2e7d32; --warn:#b26a00; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--fg); background:var(--bg); }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  .card { background:var(--card); border-radius:14px; padding:24px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size:1.4rem; margin:0 0 12px; }
  p { line-height:1.5; }
  label { display:block; font-weight:600; margin:16px 0 6px; }
  input[type=text] { width:100%; font-size:1.05rem; padding:10px 12px; border:1px solid #c9cfd8; border-radius:8px; }
  .consent { display:flex; gap:10px; align-items:flex-start; font-weight:400; background:#f1f4fa; padding:12px; border-radius:8px; }
  .consent input { margin-top:4px; transform:scale(1.2); }
  button { font:inherit; font-size:1rem; padding:12px 18px; border-radius:10px; border:1px solid #c9cfd8; background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:16px; }
  .progress { color:var(--muted); text-align:center; font-size:.95rem; }
  .instr { font-size:.95rem; background:#f1f4fa; padding:10px 12px; border-radius:8px; margin:12px 0; }
  ol.words { list-style:none; padding:0; margin:16px 0 8px; display:grid; grid-template-columns:repeat(auto-fill, minmax(100px, 1fr)); gap:6px 10px; counter-reset:w; }
  ol.words li { counter-increment:w; font-size:clamp(1rem, 4.2vw, 1.25rem); font-weight:700; letter-spacing:.02em; padding:6px 4px; border-bottom:1px solid #eceff3; }
  ol.words li::before { content:counter(w); font-size:.7rem; font-weight:400; color:var(--muted); margin-right:6px; vertical-align:middle; }
  .meter { height:10px; background:#e3e7ee; border-radius:5px; overflow:hidden; margin:18px 0 4px; }
  .meter div { height:100%; width:0; background:var(--ok); transition: width .05s linear; }
  #recBtn { width:100px; height:100px; border-radius:50%; font-weight:700; font-size:1.1rem; background:var(--rec); border-color:var(--rec); color:#fff; }
  #recBtn.recording { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 12px rgba(198,40,40,.18); } }
  .status { text-align:center; min-height:1.5em; margin-top:10px; color:var(--muted); }
  .status.warn { color:var(--warn); font-weight:600; }
  .status.err { color:var(--rec); font-weight:600; }
  ul.files { list-style:none; padding:0; margin:16px 0; font-size:.92rem; }
  ul.files li { display:flex; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px solid #eceff3; }
  .ok { color:var(--ok); } .bad { color:var(--rec); } .pending { color:var(--muted); }
  .hint { font-size:.85rem; color:var(--muted); text-align:center; }
  /* Custom text panel + display */
  details.custom { margin:16px 0 0; border:1px solid #dfe3ea; border-radius:8px; padding:0 12px; }
  details.custom summary { cursor:pointer; font-weight:600; padding:12px 0; }
  details.custom[open] { padding-bottom:12px; }
  details.custom label { margin-top:12px; }
  details.custom label.inline { display:flex; gap:8px; align-items:center; font-weight:400; margin:6px 0; }
  fieldset.mode { border:0; padding:0; margin:0; }
  fieldset.mode legend { font-weight:600; padding:0; margin-bottom:4px; }
  textarea { width:100%; min-height:140px; font:inherit; font-size:1rem; padding:10px 12px; border:1px solid #c9cfd8; border-radius:8px; resize:vertical; }
  input[type=file] { font:inherit; font-size:.95rem; max-width:100%; }
  .small { font-size:.88rem; color:var(--muted); margin:6px 0 0; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  ol.words.long { grid-template-columns:1fr; }
  ol.words.long li { font-weight:600; }
  .single { margin:16px 0 8px; text-align:center; }
  .single-count { color:var(--muted); font-size:.95rem; min-height:1.4em; }
  .single-item { min-height:4.5em; display:flex; align-items:center; justify-content:center; padding:12px 8px; margin:8px 0;
                 border:2px solid #e3e7ee; border-radius:12px; font-size:clamp(1.6rem, 8vw, 2.6rem); font-weight:700; line-height:1.3; overflow-wrap:anywhere; }
  .single-item.long { font-size:clamp(1.15rem, 5vw, 1.6rem); font-weight:600; }
  .single-item.waiting { font-size:1rem; font-weight:400; color:var(--muted); }
  button.big { min-width:180px; min-height:56px; font-size:1.15rem; }
  .passage { white-space:pre-wrap; font-size:clamp(1.05rem, 4.2vw, 1.25rem); line-height:1.75; margin:16px 0 8px; padding:4px 2px; overflow-wrap:anywhere; }
</style>
</head>
<body>
<main>

  <!-- Start screen -->
  <section id="sStart" class="card">
    <h1 id="title">Word list recording</h1>
    <p id="intro"></p>
    <label for="pid" id="idLabel">Student ID</label>
    <input id="pid" type="text" autocomplete="off" placeholder="e.g. 2301234 or J.Smith">
    <details class="custom" id="customPanel" hidden>
      <summary>Use your own text (optional)</summary>
      <p class="small">Leave this empty to use the standard list.</p>
      <fieldset class="mode">
        <legend>Show it as</legend>
        <label class="inline"><input type="radio" name="mode" value="list" checked> A list (one word or phrase per line)</label>
        <label class="inline"><input type="radio" name="mode" value="passage"> A passage (normal running text)</label>
      </fieldset>
      <label for="customText">Type or paste your text</label>
      <textarea id="customText" dir="auto" spellcheck="false"></textarea>
      <label for="customFile">…or open a .txt file</label>
      <input id="customFile" type="file" accept=".txt,text/plain">
      <label for="customName">Short name for this text (used in file names)</label>
      <input id="customName" type="text" autocomplete="off" placeholder="e.g. rainbow">
      <p class="small" id="customInfo" aria-live="polite"></p>
      <div class="row"><button id="customClear" type="button">Clear</button></div>
    </details>
    <label class="consent"><input id="consent" type="checkbox"> <span id="consentText"></span></label>
    <div class="row"><button id="startBtn" class="primary" disabled>Start</button></div>
    <div id="startStatus" class="status"></div>
  </section>

  <!-- Recording screen -->
  <section id="sRec" class="card" hidden>
    <div class="progress" id="progress"></div>
    <div class="instr" id="instr"></div>
    <ol class="words" id="wordList" dir="auto"></ol>
    <div class="passage" id="passage" dir="auto" hidden></div>
    <div class="single" id="single" hidden>
      <div class="single-count" id="itemCount"></div>
      <div class="single-item" id="itemText" dir="auto" aria-live="polite"></div>
      <div class="row"><button id="itemNextBtn" class="primary big" disabled>Next &rarr;</button></div>
    </div>
    <div class="meter"><div id="meterBar"></div></div>
    <div class="row"><button id="recBtn">Record</button></div>
    <div class="status" id="recStatus"></div>
    <div class="row">
      <button id="prevBtn">&larr; Back</button>
      <button id="playBtn" disabled>&#9654; Play</button>
      <button id="nextBtn" class="primary" disabled>Next &rarr;</button>
    </div>
    <p class="hint" id="recHint">Desktop: press the space bar to start/stop recording.</p>
  </section>

  <!-- Finish screen -->
  <section id="sDone" class="card" hidden>
    <h1>All done – thank you!</h1>
    <p id="doneMsg"></p>
    <ul class="files" id="fileList"></ul>
    <div class="row">
      <button id="retryBtn" class="primary" hidden>Retry failed uploads</button>
      <button id="zipBtn">Download all (zip)</button>
      <a id="reqLink" hidden target="_blank" rel="noopener"><button class="primary">Open upload folder</button></a>
    </div>
  </section>

</main>
<script>
/* ================== CONFIGURATION – edit this part ================== */
const CONFIG = {
  title: "Word list recording",
  // {repeatNote} is filled in automatically from the number of repetitions (empty when it's 1).
  intro: "Thank you for helping out with this activity! You'll be asked to read some words aloud.{repeatNote} You can play back and re-record before moving on. Please use a quiet room.",
  idLabel: "Name or student ID",
  consentText: "I agree to my recordings being stored and used for teaching purposes in this module.",

  // Shown above the word list on each reading ({n} and {total} can be used for the reading number).
  readingInstructions: "Press Record, read the words in order (left to right, row by row) at a natural pace with a short pause between words, then press Stop. Please don't say anything else, and don't read the numbers.",

  // Power Automate "When an HTTP request is received" URL. Leave "" to skip automatic upload.
  uploadUrl: "",

  // Optional OneDrive "Request files" link – shown as a backup way to hand in the zip.
  requestFilesUrl: "",

  // Number of separate readings (one WAV each). Can be overridden in the page URL with ?reps=3
  repetitions: 1,
  maxSeconds: 180,         // auto-stop safety limit per reading (raised automatically for long texts)

  // How the text is shown during recording. Can be overridden in the page URL with ?show=one or ?show=all
  //   "all" = whole list/passage on screen at once
  //   "one" = one item at a time, all in a single recording. Lists show one item per screen;
  //           passages show one line per screen (put each sentence on its own line).
  presentation: "all",
  // Only for "one": seconds per item before the next appears automatically.
  // 0 = participant moves on themselves (Next button, Enter, → or space bar).
  // Can be overridden in the URL with ?auto=2.5
  autoAdvanceSeconds: 0,
  oneAtATimeInstructions: "Press Record. One item will appear at a time. Read it aloud, then press Next (or the space bar) for the next one. After the last item, press Next once more to finish the recording.",
  autoAdvanceInstructions: "Press Record. One item will appear at a time and change by itself every {secs} seconds. Read each one aloud as it appears. The recording stops after the last item.",

  // ---- Custom text ("Use your own text" panel on the start screen) ----
  allowCustomText: true,   // false = hide the panel; participants only see the lists below
  customDefaultName: "custom",   // file-name prefix if the user doesn't give the text a name
  customMaxChars: 10000,   // longest text accepted (typed or uploaded)
  // Shown instead of readingInstructions when a custom text is displayed as a passage.
  passageInstructions: "Press Record, read the text aloud from start to finish at a natural pace, then press Stop. If you stumble, just carry on – or re-record if you prefer.",

  // Word lists. Choose one with ?list=name in the page URL; the first list is the default.
  lists: {
    wells: ["KIT", "DRESS", "TRAP", "LOT", "STRUT", "FOOT", "BATH", "CLOTH", "NURSE", "FLEECE", "FACE", "PALM", "THOUGHT", "GOAT", "GOOSE", "PRICE", "CHOICE", "MOUTH", "NEAR", "SQUARE", "START", "NORTH", "FORCE", "CURE", "HAPPY", "LETTER", "COMMA"]
  }
};
/* ==================================================================== */

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
let listName = (params.get("list") && CONFIG.lists[params.get("list")]) ? params.get("list") : Object.keys(CONFIG.lists)[0];
const DEFAULT_LIST = listName;
let WORDS = CONFIG.lists[listName];
let textMode = "list";            // "list" or "passage"
let passageText = "";             // only used in passage mode
let textSource = "config list: " + listName;

const urlNum = (k, lo, hi) => { const v = parseFloat(params.get(k)); return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : null; };
const REPS = Math.round(urlNum("reps", 1, 20) ?? Math.max(1, CONFIG.repetitions));
const ONE_AT_A_TIME = (params.get("show") || CONFIG.presentation) === "one";
const AUTO_SECS = ONE_AT_A_TIME ? (urlNum("auto", 0, 60) ?? CONFIG.autoAdvanceSeconds) : 0;
let ITEMS = [];                  // what's shown one at a time (list items, or passage lines)
let itemIdx = -1, recSamples = 0, itemTimes = [], autoTimer = null;
const takeInfo = [];             // per-reading timing info for the info file
const state = { pid: "", idx: 0, takes: new Array(REPS).fill(null), uploaded: {}, consentTime: null };
let ctx, stream, node, chunks = [], recording = false, peak = 0, recPeak = 0, autoStop = null, trackSettings = {};

/* ---------- Start screen ---------- */
$("title").textContent = CONFIG.title;
document.title = CONFIG.title;
$("intro").textContent = CONFIG.intro.replace("{repeatNote}",
  REPS > 1 ? ` You'll do this ${REPS} times, and each reading is recorded separately.` : "");
$("idLabel").textContent = CONFIG.idLabel;
$("consentText").textContent = CONFIG.consentText;

const cleanId = s => s.trim().replace(/[^A-Za-z0-9_-]/g, "");
function checkStart() { $("startBtn").disabled = !(cleanId($("pid").value) && $("consent").checked); }
$("pid").addEventListener("input", checkStart);
$("consent").addEventListener("change", checkStart);

/* ---------- Custom text ---------- */
let customFileName = "";
const customMode = () => document.querySelector('input[name="mode"]:checked').value;
const normalise = s => s.replace(/^﻿/, "").replace(/\r\n?/g, "\n").trim();
function parseItems(s) {
  let lines = s.split("\n").map(x => x.trim()).filter(Boolean);
  // A single line with commas or tabs ("cat, dog, bat") is treated as a list too.
  if (lines.length === 1 && /[,\t]/.test(lines[0])) lines = lines[0].split(/[,\t]/).map(x => x.trim()).filter(Boolean);
  return lines;
}
function updateCustomInfo() {
  const t = normalise($("customText").value);
  let msg = "";
  if (t) {
    msg = customMode() === "list"
      ? `${parseItems(t).length} item(s) will be shown.`
      : `${t.split(/\s+/).length} words will be shown as a passage.`;
    if (customFileName) msg += ` Loaded from ${customFileName}.`;
  }
  $("customInfo").textContent = msg;
}
if (CONFIG.allowCustomText) {
  $("customPanel").hidden = false;
  $("customText").maxLength = CONFIG.customMaxChars;
  $("customText").addEventListener("input", () => { customFileName = ""; updateCustomInfo(); });
  document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener("change", updateCustomInfo));
  $("customFile").addEventListener("change", async e => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      if (f.size > CONFIG.customMaxChars * 4) throw new Error("too big");
      let t = normalise(await f.text());
      if (t.includes("�")) throw new Error("encoding");
      if (t.length > CONFIG.customMaxChars) throw new Error("too big");
      $("customText").value = t;
      customFileName = f.name;
      if (!$("customName").value) $("customName").value = cleanId(f.name.replace(/\.[^.]*$/, "")).slice(0, 30);
      updateCustomInfo();
    } catch (err) {
      $("customInfo").textContent = err.message === "encoding"
        ? "That file isn't plain UTF-8 text. In Notepad or Word, use 'Save as' → Plain text (UTF-8), then try again."
        : err.message === "too big"
        ? `That file is too long (limit ${CONFIG.customMaxChars} characters).`
        : "Couldn't read that file. Try copying and pasting the text instead.";
    }
    e.target.value = "";   // allow re-selecting the same file
  });
  $("customClear").addEventListener("click", () => {
    $("customText").value = ""; $("customName").value = ""; customFileName = ""; updateCustomInfo();
  });
}

// Called on Start: use the custom text if there is one, otherwise the configured list.
function applyCustomText() {
  const t = CONFIG.allowCustomText ? normalise($("customText").value) : "";
  if (!t) {   // back to the configured list (in case Start was pressed before with custom text)
    listName = DEFAULT_LIST; WORDS = CONFIG.lists[listName]; textMode = "list"; passageText = "";
    textSource = "config list: " + listName;
    return true;
  }
  textMode = customMode();
  listName = cleanId($("customName").value).slice(0, 30) || CONFIG.customDefaultName;
  textSource = customFileName ? "uploaded file: " + customFileName : "typed/pasted";
  if (textMode === "list") {
    WORDS = parseItems(t);
    if (!WORDS.length) return false;
  } else {
    passageText = t;
    WORDS = t.split(/\s+/);
  }
  return true;
}

function renderText() {
  $("wordList").innerHTML = "";
  if (ONE_AT_A_TIME) {
    ITEMS = textMode === "passage" ? passageText.split("\n").map(x => x.trim()).filter(Boolean) : WORDS.slice();
    $("wordList").hidden = true;
    $("passage").hidden = true;
    $("single").hidden = false;
    $("itemNextBtn").hidden = AUTO_SECS > 0;
    $("recHint").textContent = AUTO_SECS > 0
      ? "Desktop: press the space bar to start/stop recording."
      : "Desktop: space bar to start, then space bar, Enter or → for the next item.";
    showItem(-1);
    return;
  }
  if (textMode === "passage") {
    $("wordList").hidden = true;
    $("passage").hidden = false;
    $("passage").textContent = passageText;
    return;
  }
  for (const w of WORDS) { const li = document.createElement("li"); li.textContent = w; $("wordList").appendChild(li); }
  // Long items (phrases/sentences) get one per row instead of the grid.
  $("wordList").classList.toggle("long", WORDS.some(w => w.length > 14));
}

$("startBtn").addEventListener("click", async () => {
  state.pid = cleanId($("pid").value);
  if (!applyCustomText()) {
    $("startStatus").className = "status err";
    $("startStatus").textContent = "Your custom text is empty. Add some text or clear the box.";
    return;
  }
  renderText();
  state.consentTime = new Date().toISOString();
  try {
    await initAudio();
  } catch (e) {
    $("startStatus").className = "status err";
    $("startStatus").textContent = micErrorMessage(e);
    return;
  }
  $("sStart").hidden = true;
  $("sRec").hidden = false;
  showWord();
});

function micErrorMessage(e) {
  if (!window.isSecureContext || !navigator.mediaDevices)
    return "This page isn't being served securely, so the browser blocks the microphone. Open it from its https:// address (e.g. GitHub Pages), not as a downloaded file or inside another app.";
  if (window.self !== window.top)
    return "This page is running inside another page or app preview, which blocks the microphone. Open it directly in Chrome, Edge, Firefox or Safari.";
  switch (e.name) {
    case "NotAllowedError":
    case "SecurityError":
      return "Microphone permission was refused. Click the lock/settings icon next to the address bar, allow the microphone, and reload. On Windows, also check Settings → Privacy & security → Microphone and make sure your browser is allowed.";
    case "NotFoundError":
      return "No microphone was found. Plug in or enable a microphone and reload.";
    case "NotReadableError":
      return "The microphone is in use by another app (e.g. Teams or Zoom) or blocked by the system. Close other apps using it and reload.";
    case "OverconstrainedError":
      return "Your microphone doesn't support the requested settings. Please tell your tutor (" + e.name + ").";
    default:
      return "Couldn't access the microphone (" + e.name + ": " + e.message + "). Please reload and try again.";
  }
}

/* ---------- Audio capture (raw PCM, no browser processing) ---------- */
async function initAudio() {
  stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: false }
  });
  trackSettings = stream.getAudioTracks()[0].getSettings ? stream.getAudioTracks()[0].getSettings() : {};
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  await ctx.resume();
  const source = ctx.createMediaStreamSource(stream);
  const onData = buf => {
    let p = 0;
    for (let i = 0; i < buf.length; i++) { const a = Math.abs(buf[i]); if (a > p) p = a; }
    peak = Math.max(peak * 0.9, p);
    if (recording) { chunks.push(buf); recSamples += buf.length; if (p > recPeak) recPeak = p; }
  };
  if (ctx.audioWorklet && window.AudioWorkletNode) {
    const code = "class R extends AudioWorkletProcessor{process(i){const c=i[0]&&i[0][0];if(c)this.port.postMessage(c.slice(0));return true;}}registerProcessor('rec',R);";
    const url = URL.createObjectURL(new Blob([code], { type: "application/javascript" }));
    await ctx.audioWorklet.addModule(url);
    node = new AudioWorkletNode(ctx, "rec");
    node.port.onmessage = e => onData(e.data);
  } else {
    node = ctx.createScriptProcessor(4096, 1, 1);
    node.onaudioprocess = e => onData(new Float32Array(e.inputBuffer.getChannelData(0)));
  }
  source.connect(node);
  const mute = ctx.createGain(); mute.gain.value = 0;   // keeps the graph running without echoing the mic
  node.connect(mute); mute.connect(ctx.destination);
  requestAnimationFrame(drawMeter);
}

function drawMeter() {
  $("meterBar").style.width = Math.min(100, Math.sqrt(peak) * 100) + "%";
  $("meterBar").style.background = peak > 0.98 ? "var(--rec)" : "var(--ok)";
  peak *= 0.92;
  requestAnimationFrame(drawMeter);
}

function encodeWav(parts, sr) {
  const n = parts.reduce((a, c) => a + c.length, 0);
  const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVE");
  str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, "data"); v.setUint32(40, n * 2, true);
  let o = 44;
  for (const c of parts) for (let i = 0; i < c.length; i++) {
    const s = Math.max(-1, Math.min(1, c[i]));
    v.setInt16(o, s < 0 ? s * 0x8000 : s * 0x7fff, true); o += 2;
  }
  return new Blob([buf], { type: "audio/wav" });
}

/* ---------- Recording screen ---------- */
const fileName = i => `${listName}_${state.pid}_rep${i + 1}.wav`;

function showWord() {
  const i = state.idx;
  $("progress").textContent = REPS > 1 ? `Reading ${i + 1} of ${REPS}` : "";
  $("progress").hidden = REPS === 1;
  const instr = ONE_AT_A_TIME
    ? (AUTO_SECS > 0 ? CONFIG.autoAdvanceInstructions : CONFIG.oneAtATimeInstructions)
    : textMode === "passage" ? CONFIG.passageInstructions : CONFIG.readingInstructions;
  $("instr").textContent = instr.replace("{n}", i + 1).replace("{total}", REPS).replace("{secs}", AUTO_SECS);
  if (ONE_AT_A_TIME && !recording) showItem(-1);
  $("prevBtn").disabled = i === 0;
  $("playBtn").disabled = !state.takes[i];
  $("nextBtn").disabled = !state.takes[i];
  $("nextBtn").innerHTML = i === REPS - 1 ? "Finish" : "Next reading &rarr;";
  setStatus(state.takes[i] ? "Recorded ✓ – play it back, re-record, or move on." : "");
}
function setStatus(msg, cls = "") { $("recStatus").className = "status " + cls; $("recStatus").textContent = msg; }

/* One-at-a-time display. k = -1 → waiting to start, k = ITEMS.length → finished. */
function showItem(k) {
  itemIdx = k;
  const box = $("itemText");
  box.classList.remove("waiting", "long");
  if (k < 0) {
    $("itemCount").textContent = `${ITEMS.length} items`;
    box.textContent = "Press Record to see the first item";
    box.classList.add("waiting");
    $("itemNextBtn").disabled = true;
    $("itemNextBtn").innerHTML = "Next &rarr;";
  } else if (k >= ITEMS.length) {
    $("itemCount").textContent = "";
    box.textContent = "Finished – thank you!";
    box.classList.add("waiting");
    $("itemNextBtn").disabled = true;
  } else {
    $("itemCount").textContent = `${k + 1} of ${ITEMS.length}`;
    box.textContent = ITEMS[k];
    box.classList.toggle("long", ITEMS[k].length > 14);
    $("itemNextBtn").disabled = false;
    $("itemNextBtn").innerHTML = k === ITEMS.length - 1 ? "Finish recording" : "Next &rarr;";
  }
}
// Move to the next item, noting when it appeared (seconds from the start of the WAV).
function advanceItem() {
  if (!recording || stopping) return;
  const next = itemIdx + 1;
  if (next >= ITEMS.length) { showItem(ITEMS.length); stopRec(); return; }
  itemTimes.push({ index: next + 1, item: ITEMS[next], shownAt: +(recSamples / ctx.sampleRate).toFixed(3) });
  showItem(next);
  if (AUTO_SECS > 0) { clearTimeout(autoTimer); autoTimer = setTimeout(advanceItem, AUTO_SECS * 1000); }
}
$("itemNextBtn").addEventListener("click", advanceItem);

let stopping = false;
function startRec() {
  if (ctx.state !== "running") ctx.resume();
  chunks = []; recPeak = 0; recSamples = 0; itemTimes = []; recording = true; stopping = false;
  $("recBtn").textContent = "Stop"; $("recBtn").classList.add("recording");
  ["prevBtn", "playBtn", "nextBtn"].forEach(b => $(b).disabled = true);
  // Long texts get a longer safety limit (~1 s per word + 30 s; more if auto-advancing).
  let limit = Math.max(CONFIG.maxSeconds, WORDS.length + 30);
  if (ONE_AT_A_TIME) {
    limit = Math.max(limit, ITEMS.length * (AUTO_SECS || 5) + 30);
    setStatus(AUTO_SECS > 0 ? "Recording… read each item as it appears." : "Recording… read each item, then press Next.");
    itemIdx = -1;
    advanceItem();   // first item appears at t = 0
  } else {
    setStatus(textMode === "passage" ? "Recording… read the whole text, then press Stop." : "Recording… read the whole list, then press Stop.");
  }
  autoStop = setTimeout(stopRec, limit * 1000);
}
function stopRec() {
  if (!recording || stopping) return;
  stopping = true;
  clearTimeout(autoStop); clearTimeout(autoTimer);
  const reachedEnd = !ONE_AT_A_TIME || itemIdx >= ITEMS.length;
  if (ONE_AT_A_TIME) $("itemNextBtn").disabled = true;
  setTimeout(() => {               // short tail so the last word isn't clipped
    recording = false; stopping = false;
    $("recBtn").textContent = "Record"; $("recBtn").classList.remove("recording");
    const blob = encodeWav(chunks, ctx.sampleRate);
    state.takes[state.idx] = blob;
    takeInfo[state.idx] = {
      file: fileName(state.idx), durationSec: +(recSamples / ctx.sampleRate).toFixed(3),
      ...(ONE_AT_A_TIME ? { itemsShown: itemTimes.length, completed: reachedEnd, items: itemTimes } : {})
    };
    delete state.uploaded[fileName(state.idx)];
    showWord();
    if (ONE_AT_A_TIME) showItem(reachedEnd ? ITEMS.length : -1);
    if (!reachedEnd) setStatus(`Stopped at item ${itemTimes.length} of ${ITEMS.length}. Press Record to start again from the beginning, or move on if that's intended.`, "warn");
    else if (recPeak > 0.98) setStatus("That was too loud (clipped). Move back a little and re-record.", "warn");
    else if (recPeak < 0.03) setStatus("That was very quiet. Check your microphone and re-record.", "warn");
  }, 250);
}
$("recBtn").addEventListener("click", () => recording ? stopRec() : startRec());
$("playBtn").addEventListener("click", () => {
  const b = state.takes[state.idx];
  if (b) new Audio(URL.createObjectURL(b)).play();
});
$("prevBtn").addEventListener("click", () => { state.idx--; showWord(); });
$("nextBtn").addEventListener("click", () => {
  if (state.idx < REPS - 1) { state.idx++; showWord(); window.scrollTo(0, 0); }
  else finish();
});
document.addEventListener("keydown", e => {
  if ($("sRec").hidden || e.repeat) return;
  // In one-at-a-time (manual) mode, space/Enter/→ move on while recording; Stop stays on the button.
  if (ONE_AT_A_TIME && !AUTO_SECS && recording && ["Space", "Enter", "NumpadEnter", "ArrowRight"].includes(e.code)) {
    e.preventDefault(); advanceItem(); return;
  }
  if (e.code === "Space") { e.preventDefault(); $("recBtn").click(); }
});

/* ---------- Finish: upload + zip ---------- */
function infoFile() {
  const info = {
    id: state.pid, list: listName, textSource, displayMode: textMode,
    ...(textMode === "passage" ? { text: passageText } : { words: WORDS }), repetitions: REPS,
    presentation: ONE_AT_A_TIME ? "one at a time" : "all at once", autoAdvanceSeconds: AUTO_SECS,
    ...(ONE_AT_A_TIME ? { itemsShownOneAtATime: ITEMS } : {}),
    takes: takeInfo,
    timingNote: ONE_AT_A_TIME ? "items[].shownAt = seconds from the start of the WAV when the item appeared on screen (accurate to roughly ±50 ms)" : undefined,
    consent: CONFIG.consentText, consentTime: state.consentTime,
    finished: new Date().toISOString(), sampleRate: ctx.sampleRate, bitDepth: 16, channels: 1,
    micSettings: trackSettings, userAgent: navigator.userAgent
  };
  return { name: `${listName}_${state.pid}_info.json`, blob: new Blob([JSON.stringify(info, null, 2)], { type: "application/json" }) };
}
function allFiles() {
  return [...state.takes.map((b, i) => ({ name: fileName(i), blob: b })), infoFile()];
}

function blobToBase64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(",")[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}
async function uploadOne(f) {
  const sep = CONFIG.uploadUrl.includes("?") ? "&" : "?";
  const r = await fetch(CONFIG.uploadUrl + sep + "filename=" + encodeURIComponent(f.name), {
    method: "POST", headers: { "Content-Type": "text/plain" }, body: await blobToBase64(f.blob)
  });
  if (!r.ok) throw new Error("HTTP " + r.status);
}

function renderList(files) {
  $("fileList").innerHTML = "";
  for (const f of files) {
    const li = document.createElement("li");
    const st = state.uploaded[f.name];
    const label = !CONFIG.uploadUrl ? "" : st === true ? "✓ uploaded" : st === false ? "✗ failed" : st === "busy" ? "uploading…" : "waiting";
    const cls = st === true ? "ok" : st === false ? "bad" : "pending";
    li.innerHTML = `<span></span><span class="${cls}">${label}</span>`;
    li.firstChild.textContent = f.name;
    $("fileList").appendChild(li);
  }
}

async function uploadAll() {
  const files = allFiles();
  $("retryBtn").hidden = true;
  for (const f of files) {
    if (state.uploaded[f.name] === true) continue;
    state.uploaded[f.name] = "busy"; renderList(files);
    try { await uploadOne(f); state.uploaded[f.name] = true; }
    catch (e) { state.uploaded[f.name] = false; }
    renderList(files);
  }
  const failed = files.filter(f => state.uploaded[f.name] !== true).length;
  if (failed) {
    $("retryBtn").hidden = false;
    $("doneMsg").textContent = `${failed} file(s) didn't upload. Try again, or download the zip` + (CONFIG.requestFilesUrl ? " and add it to the upload folder." : " and send it to your tutor.");
  } else {
    $("doneMsg").textContent = "All your recordings have been uploaded. You can close this page.";
  }
}

function finish() {
  $("sRec").hidden = true; $("sDone").hidden = false;
  if (CONFIG.requestFilesUrl) { $("reqLink").href = CONFIG.requestFilesUrl; $("reqLink").hidden = false; }
  renderList(allFiles());
  if (CONFIG.uploadUrl) {
    $("doneMsg").textContent = "Uploading your recordings…";
    uploadAll();
  } else {
    $("doneMsg").textContent = "Please download the zip file" + (CONFIG.requestFilesUrl ? ", then press 'Open upload folder' and add it there." : " and send it to your tutor.");
  }
}
$("retryBtn").addEventListener("click", uploadAll);
$("zipBtn").addEventListener("click", async () => {
  const blob = await makeZip(allFiles());
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${listName}_${state.pid}.zip`;
  document.body.appendChild(a); a.click(); a.remove();
});

window.addEventListener("beforeunload", e => {
  const started = state.takes.some(Boolean);
  const done = CONFIG.uploadUrl && allFilesUploaded();
  if (started && !done) { e.preventDefault(); e.returnValue = ""; }
});
function allFilesUploaded() { return ctx && allFiles().every(f => state.uploaded[f.name] === true); }

/* ---------- Minimal zip writer (stored, no compression) ---------- */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
async function makeZip(files) {
  const enc = new TextEncoder(), parts = [], central = [];
  let offset = 0;
  const d = new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const f of files) {
    const name = enc.encode(f.name), data = new Uint8Array(await f.blob.arrayBuffer()), crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(lh.buffer, name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true);
    ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(ch.buffer, name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((a, p) => a + p.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end.buffer], { type: "application/zip" });
}
</script>
